<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A local folder and a Google Drive folder kept in sync by dsync push and pull">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ec"/>
      <stop offset="1" stop-color="#ffcfc5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#25252a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="700" cy="520" r="150" fill="#fff8f6" opacity="0.6"/>

  <!-- local folder -->
  <g transform="translate(140 110)" filter="url(#shadow)">
    <path d="M0 24c0-13 11-24 24-24h60l20 22h86c13 0 24 11 24 24v110c0 13-11 24-24 24H24C11 180 0 169 0 156z" fill="#25252a"/>
    <rect x="0" y="40" width="214" height="140" rx="22" fill="#3b3b3f"/>
    <text x="107" y="122" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#f3f3f5">~/gdrive</text>
  </g>

  <!-- Drive cloud -->
  <g transform="translate(450 110)" filter="url(#shadow)">
    <path d="M60 180h120c38 0 64-26 64-60 0-32-24-58-56-60-8-34-38-58-74-58-34 0-62 22-72 52C14 58 0 80 0 112c0 38 26 68 60 68z" fill="#ffffff"/>
    <path d="M122 140V86" stroke="#25252a" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 106l22-22 22 22" fill="none" stroke="#25252a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="166" text-anchor="middle" font-family="DM Sans, Figtree, system-ui, sans-serif" font-size="16" font-weight="600" fill="#83838a">Drive</text>
  </g>

  <!-- sync arrows -->
  <g fill="none" stroke="#25252a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 170h70"/><path d="M428 158l12 12-12 12"/>
    <path d="M440 220h-70"/><path d="M382 208l-12 12 12 12"/>
  </g>

  <!-- terminal -->
  <g transform="translate(140 340)" filter="url(#shadow)">
    <rect width="520" height="166" rx="14" fill="#1b1b1f"/>
    <circle cx="24" cy="22" r="6" fill="#ff7a6b"/><circle cx="44" cy="22" r="6" fill="#ffc940"/><circle cx="64" cy="22" r="6" fill="#6dbf2a"/>
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#d7d7da">
      <text x="24" y="64"><tspan fill="#ababb0">$</tspan> dsync push</text>
      <text x="24" y="92"><tspan fill="#b4cdb2">+ add</tspan><tspan x="124">notes/plan.md</tspan><tspan x="330">4.2 KB</tspan></text>
      <text x="24" y="118"><tspan fill="#d7c59c">~ modify</tspan><tspan x="124">photos/reef.jpg</tspan><tspan x="330">1.8 MB</tspan></text>
      <text x="24" y="140" fill="#ababb0">Proceed? [y/N]</text>
    </g>
  </g>
  <text x="400" y="556" text-anchor="middle" font-family="DM Sans, Figtree, system-ui, sans-serif" font-size="20" font-weight="600" fill="#25252a">push · pull · diff</text>
</svg>
