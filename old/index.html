<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#25252a" />
    <meta
      name="description"
      content="Old experiments and projects from YADV Labs, 2008 to 2013."
    />
    <link rel="canonical" href="https://labs.yadv.in/old/" />
    <script>
      try {
        var mode = localStorage.getItem('yadv-color-mode');
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.dataset.theme = mode;
        }
      } catch (e) {}
    </script>
    <title>Old experiments · YADV Labs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/old.tsx"></script>
  </body>
</html>
